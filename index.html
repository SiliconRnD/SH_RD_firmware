<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SH RD Firmware Downloads</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #1e40af);
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            opacity: 0.85;
            font-size: 16px;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .info {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .info h2 {
            margin-top: 0;
            color: #1e40af;
        }

        .firmware {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            border-left: 5px solid #2563eb;
        }

        .firmware-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .firmware h3 {
            margin: 0;
            font-size: 21px;
        }

        .version {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .detail {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .download {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 30px 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 26px;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SH RD Firmware</h1>
    <p>Official firmware download center</p>
</header>

<div class="container">

    <div class="info">
        <h2>Firmware Downloads</h2>

        <p>
            Download the latest firmware for your SH RD device.
            Please verify the device model and firmware version
            before installation.
        </p>
    </div>

    <div id="firmware-list"></div>

</div>

<footer>
    © 2026 SiliconRnD · SH RD Firmware
</footer>


<script>

    /*
     * ============================================================
     * FIRMWARE FILES
     * ============================================================
     *
     * Change the information below to match the .bin files
     * inside your repository's "files" folder.
     *
     * Example:
     *
     * files/
     *   SH_RD_v1.0.0.bin
     *   SH_RD_v1.1.0.bin
     */

    const firmwares = [

        {
            name: "SH RD Firmware",
            version: "v1.0.0",
            file: "SH_RD_v1.0.0.bin",
            date: "2026-08-21",
            description: "Initial firmware release"
        },

        {
            name: "SH RD Firmware",
            version: "v1.1.0",
            file: "SH_RD_v1.1.0.bin",
            date: "2026-08-21",
            description: "Latest firmware release"
        }

    ];


    /*
     * ============================================================
     * DO NOT EDIT BELOW THIS LINE
     * ============================================================
     */

    const container = document.getElementById("firmware-list");

    firmwares.forEach((firmware) => {

        const card = document.createElement("div");
        card.className = "firmware";

        card.innerHTML = `
            <div class="firmware-header">

                <h3>${firmware.name}</h3>

                <span class="version">
                    ${firmware.version}
                </span>

            </div>

            <p>
                ${firmware.description}
            </p>

            <div class="details">

                <div class="detail">
                    <strong>Version</strong>
                    ${firmware.version}
                </div>

                <div class="detail">
                    <strong>Release Date</strong>
                    ${firmware.date}
                </div>

                <div class="detail">
                    <strong>File</strong>
                    ${firmware.file}
                </div>

            </div>

            <a
                class="download"
                href="files/${encodeURIComponent(firmware.file)}"
                download
            >
                ⬇ Download Firmware
            </a>

        `;

        container.appendChild(card);

    });

</script>

</body>
</html>
